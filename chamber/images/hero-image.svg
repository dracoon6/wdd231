<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" preserveAspectRatio="xMidYMid slice">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E0F6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4B5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="1200" height="400" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="1000" cy="80" r="60" fill="#FFD700" opacity="0.8"/>
  
  <!-- Background mountains -->
  <path d="M 0 300 Q 150 200 300 280 T 600 250 T 900 300 L 1200 300 L 1200 400 L 0 400 Z" fill="#A0826D" opacity="0.5"/>
  
  <!-- Foreground mountains -->
  <path d="M 0 250 L 200 100 L 350 200 L 500 80 L 700 150 L 900 60 L 1100 180 L 1200 120 L 1200 400 L 0 400 Z" fill="url(#mountainGradient)"/>
  
  <!-- Snow caps on mountains -->
  <path d="M 200 100 L 240 140 L 160 140 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 500 80 L 550 130 L 450 130 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 900 60 L 950 120 L 850 120 Z" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Foreground trees -->
  <g opacity="0.7">
    <!-- Left trees -->
    <path d="M 50 250 L 70 180 L 90 250 Z" fill="#2D5016"/>
    <path d="M 100 260 L 125 170 L 150 260 Z" fill="#2D5016"/>
    
    <!-- Right trees -->
    <path d="M 1100 280 L 1130 200 L 1160 280 Z" fill="#2D5016"/>
    <path d="M 1050 290 L 1080 210 L 1110 290 Z" fill="#2D5016"/>
  </g>
</svg>
